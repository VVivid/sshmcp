# Private CP5 authorization infrastructure, installed only on the control VM.
# ARM64 manifest digests are pinned; ports bind to guest loopback only.
services:
  postgres:
    image: postgres:17.11-alpine@sha256:0b2882c46a2b8d8e148431b333394348cf4d7f15aec6df7f17d51dc641e56cfa
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?private .env required}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U keycloak -d keycloak"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:5cc3f249dea86003ccd0377077a3cc70cbf24686bd2a86260ef85ab1aebc9eda
    command: [start, --http-enabled=true, --hostname=http://127.0.0.1:18081, --features=resource-indicators, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?private .env required}
      KC_BOOTSTRAP_ADMIN_USERNAME: bootstrap-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?private .env required}
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx512m
    ports:
      - 127.0.0.1:18082:8080
    volumes:
      - ./realm.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres:
