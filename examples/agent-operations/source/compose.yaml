name: sshmcp-demo
services:
  app:
    image: sshmcp-demo-app:local
    build:
      context: ./app
      network: host
    restart: unless-stopped
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      OTEL_SERVICE_NAME: hello-go
    depends_on:
      lgtm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/hello", "-health"]
      interval: 15s
      timeout: 3s
      retries: 5
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  traefik:
    image: traefik:v3.6.25@sha256:31267173a15b4944e797a76ffd9c419707c8d8b32fe5b610f80cd0cfa05f372d
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ./routes.yaml:/etc/traefik/routes.yaml:ro
      - proxy-logs:/var/log/traefik
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 3s
      retries: 5
    logging: *logging
  lgtm:
    image: grafana/otel-lgtm:0.37.0@sha256:659bd027d067bff346a0847dd6ab72433a8480404b35dedc24e43a5d565613b8
    platform: linux/arm64
    restart: unless-stopped
    env_file: .env
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set private .env password}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PATHS_PROVISIONING: /demo/provisioning
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /demo/dashboards/hello.json
      PROMETHEUS_EXTRA_ARGS: --enable-feature=type-and-unit-labels --storage.tsdb.retention.time=7d
      ENABLE_LOGS_OTELCOL: "true"
      ENABLE_LOGS_PROMETHEUS: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - lgtm-data:/data
      - proxy-logs:/var/log/traefik:ro
      - ./otelcol.yaml:/otel-lgtm/otelcol-config.yaml:ro
      - ./grafana/provisioning:/demo/provisioning:ro
      - ./grafana/dashboards:/demo/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready && curl -fsS http://127.0.0.1:13133/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    stop_grace_period: 30s
    logging: *logging
volumes:
  lgtm-data:
  proxy-logs:
